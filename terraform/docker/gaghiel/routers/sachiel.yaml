http:
  routers:
    jellyfin:
      service: jellyfin
      rule: "Host(`jellyfin.home`)"
      entrypoints:
        - "web"
    calibre:
      service: calibre
      rule: "Host(`calibre.home`)"
      entrypoints:
        - "web"
  services:
    jellyfin:
      loadBalancer:
        servers:
        - url: "http://192.168.1.203:8096"
    calibre:
      loadBalancer:
        servers:
        - url: "http://192.168.1.203:8083"
