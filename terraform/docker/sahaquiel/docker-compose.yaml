# Monitoring
services:
  uptimekuma:
    image: docker.io/louislam/uptime-kuma:1.23.16
    container_name: uptimekuma
    hostname: uptimekuma
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - 3001:3001
    volumes:
      - ./config/uptimekuma:/app/data
    healthcheck:
      test: curl -fs http://localhost:3001 || exit 1
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  dozzle:
    image: amir20/dozzle:v10.10.0
    container_name: dozzle
    hostname: dozzle
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=${UID}
      - PGID=${GID}
      - TZ=${TZ}
      - DOZZLE_ENABLE_ACTIONS=true
      - DOZZLE_ENABLE_SHELL=true
      - DOZZLE_NO_ANALYTICS=true
      - DOZZLE_HOSTNAME=dozzle.home
      - DOZZLE_REMOTE_AGENT=${DOZZLE_REMOTE_AGENT}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/dozzle:/data
    ports:
      - 8080:8080
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 3s
      timeout: 30s
      retries: 5
      start_period: 30s