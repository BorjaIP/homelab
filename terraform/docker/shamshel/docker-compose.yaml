# Arr stack
# Documentation: https://trash-guides.info/
# Scripts: https://github.com/RandomNinjaAtk/arr-scripts
services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.16
    container_name: sonarr
    hostname: sonarr
    restart: always
    environment:
      - PUID=${UID}
      - PGID=${GID}
      - TZ=${TZ}
      - HTTP_PROXY=${HTTP_PROXY}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - NO_PROXY=${NO_PROXY}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    network_mode: host
    volumes:
      - ./config/sonarr:/config
      - ${STORAGE}/Transmission/complete:/downloads
      - ${STORAGE}/Media/Series:/tv
    healthcheck:
      test: curl -fs http://localhost:8989 || exit 1
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  radarr:
    image: lscr.io/linuxserver/radarr:6.0.4
    container_name: radarr
    hostname: radarr
    restart: always
    environment:
      - PUID=${UID}
      - PGID=${GID}
      - TZ=${TZ}
      - HTTP_PROXY=${HTTP_PROXY}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - NO_PROXY=${NO_PROXY}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    network_mode: host
    volumes:
      - ./config/radarr:/config
      - ${STORAGE}/Transmission/complete:/downloads
      - ${STORAGE}/Media/Movies:/movies
    healthcheck:
      test: curl -fs http://localhost:7878 || exit 1
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  lidarr:
    image: lscr.io/linuxserver/lidarr:3.1.0
    container_name: lidarr
    hostname: lidarr
    restart: always
    environment:
      - PUID=${UID}
      - PGID=${GID}
      - TZ=${TZ}
      - HTTP_PROXY=${HTTP_PROXY}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - NO_PROXY=${NO_PROXY}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    network_mode: host
    volumes:
      - ./config/lidarr:/config
      - ./config/services:/custom-services.d
      - ./config/scripts/lidarr_init.sh:/custom-cont-init.d/lidarr_init.sh
      - ${STORAGE}/Transmission/complete:/downloads
      - ${STORAGE}/Media/Music:/music
      - ${STORAGE}/Media/MediaCover:/config/MediaCover
    healthcheck:
      test: curl -fs http://localhost:8686 || exit 1
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.6.5
    container_name: prowlarr
    restart: always
    environment:
      - PUID=${UID}
      - PGID=${GID}
      - TZ=${TZ}
      - HTTP_PROXY=${HTTP_PROXY}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - NO_PROXY=${NO_PROXY}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    network_mode: host
    volumes:
      - ./config/prowlarr:/config
    healthcheck:
      test: curl -fs http://localhost:9696 || exit 1
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # Restarter for prowlarr
  # restarter:
  #   image: docker:cli
  #   container_name: restarter
  #   restart: always
  #   volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
  #   command: ["/bin/sh", "-c", "while true; do sleep 1d; docker restart prowlarr; done"]
  #   restart: unless-stopped

  # Documentation: https://docs.seerr.dev/getting-started/docker
  # Runs as UID 1000 (node); seed ./config/seerr with a copy of ./config/overseerr (migrated automatically on first start)
  seerr:
    image: ghcr.io/seerr-team/seerr:v3.5.1
    init: true
    container_name: seerr
    hostname: seerr
    restart: always
    environment:
      - TZ=${TZ}
      - PORT=5055
      - HTTP_PROXY=${HTTP_PROXY}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - NO_PROXY=${NO_PROXY}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    network_mode: host
    volumes:
      - ./config/seerr:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # Dozzle logs
  dozzle-agent:
    image: amir20/dozzle:v10.10.0
    container_name: dozzle-agent
    restart: always
    command: agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 7007:7007
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 5s
      retries: 5
      start_period: 5s
      start_interval: 5s
