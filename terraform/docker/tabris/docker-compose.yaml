  #     - ${STORAGE}:/Drive

  filebrowser:
    image: filebrowser/filebrowser:v2.32.0
    container_name: filebrowser
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=${UID}
      - PGID=${GID}
      - TZ=${TZ}
    ports:
      - 8095:80
    volumes:
      - ${STORAGE}:/srv
      - ./config/filebrowser/database.db:/database.db
      - ./config/filebrowser/settings.json:/config/settings.json

  # Documentation: https://github.com/nextcloud/docker
  # nextcloud:
  #   image: nextcloud:31.0.5
  #   container_name: nextcloud
  #   restart: always
  #   security_opt:
  #     - no-new-privileges:true
  #   depends_on:
  #     - redis
  #     - mariadb
  #   ports:
  #     - 8080:80
  #   environment:
  #     - PUID=${UID}
  #     - PGID=${GID}
  #     - TZ=${TZ}
