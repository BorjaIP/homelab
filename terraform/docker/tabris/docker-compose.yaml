# Storage tools
services:
  # SMB share of the NAS disk for Windows (Z:). Documentation: docs/samba.md
  # Image: https://github.com/ServerContainers/samba (smbd only: no wsdd2/avahi discovery needed)
  samba:
    image: ghcr.io/servercontainers/samba:smbd-only-a3.24.3-s4.23.8-r0
    container_name: samba
    restart: always
    network_mode: host
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - TZ=${TZ}
      # Login user; its files are written as UID 1001, never as root (NFS squashes root)
      - ACCOUNT_${SAMBA_USER}=${SAMBA_PASS}
      - UID_${SAMBA_USER}=1001
      - SAMBA_CONF_WORKGROUP=WORKGROUP
      - SAMBA_CONF_SERVER_STRING=Homelab NAS (tabris)
      - SAMBA_CONF_MAP_TO_GUEST=Never
      - SAMBA_GLOBAL_CONFIG_server_SPACE_min_SPACE_protocol=SMB3
      - SAMBA_GLOBAL_CONFIG_server_SPACE_signing=mandatory
      - SAMBA_GLOBAL_CONFIG_restrict_SPACE_anonymous=2
      - SAMBA_GLOBAL_CONFIG_disable_SPACE_netbios=yes
      # The disk is shared over NFS with other clients: no caching leases
      - SAMBA_GLOBAL_CONFIG_oplocks=no
      - SAMBA_GLOBAL_CONFIG_level2_SPACE_oplocks=no
      - SAMBA_GLOBAL_CONFIG_kernel_SPACE_oplocks=no
      - SAMBA_VOLUME_CONFIG_storage=[Storage]; path=/shares/Storage; valid users = ${SAMBA_USER}; guest ok = no; read only = no; browseable = yes; create mask = 0664; directory mask = 0775; vfs objects = ; veto files = /System Volume Information/; delete veto files = no
    volumes:
      - ${STORAGE}:/shares/Storage

  # Documentation: https://github.com/nextcloud/docker
  nextcloud:
    image: nextcloud:34.0.4-apache
    container_name: nextcloud
    hostname: nextcloud
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    depends_on:
      - redis
      - mariadb
    ports:
      - 8080:80
    environment:
      - TZ=${TZ}
      - MYSQL_HOST=mariadb
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - REDIS_HOST=redis
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      - NEXTCLOUD_DATA_DIR=/data
      - NEXTCLOUD_TRUSTED_DOMAINS=nextcloud.home
      - OVERWRITECLIURL=http://nextcloud.home
      - OVERWRITEHOST=nextcloud.home
      - OVERWRITEPROTOCOL=http
      - TRUSTED_PROXIES=192.168.1.206
    volumes:
      - ./config/nextcloud-html:/var/www/html
      - ./config/nextcloud-config:/var/www/html/config
      - ${STORAGE}/Documents:/data
    healthcheck:
      disable: false

  nextcloud-cron:
    image: nextcloud:34.0.4-apache
    container_name: nextcloud-cron
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    entrypoint: /cron.sh
    depends_on:
      - redis
      - mariadb
    volumes:
      - ./config/nextcloud-html:/var/www/html
      - ./config/nextcloud-config:/var/www/html/config
      - ${STORAGE}/Documents:/data

  redis:
    image: valkey/valkey:8.0.3-bookworm
    container_name: redis
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: redis-cli ping || exit 1
  
  mariadb:
    # Note: Check the recommend version here: https://docs.nextcloud.com/server/latest/admin_manual/installation/system_requirements.html#server
    image: mariadb:11.8
    container_name: mariadb
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: --transaction-isolation=READ-COMMITTED
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - ./config/mariadb:/var/lib/mysql

  # Dozzle logs
  dozzle-agent:
    image: amir20/dozzle:v10.10.0
    container_name: dozzle-agent
    restart: always
    command: agent
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 7007:7007
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 5s
      retries: 5
      start_period: 5s
      start_interval: 5s

