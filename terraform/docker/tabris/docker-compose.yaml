  #   stdin_open: true
  #   tty: true
  #   volumes:
  #     - /usr/share/zoneinfo/Europe/Madrid:/etc/localtime
  #     - ${STORAGE}:/Drive

  # Documentation: https://github.com/nextcloud/docker
  nextcloud:
    image: nextcloud:34.0.4-apache
    container_name: nextcloud
    hostname: nextcloud
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    depends_on:
      - redis
      - mariadb
    ports:
      - 8080:80
    environment:
      - TZ=${TZ}
      - MYSQL_HOST=mariadb
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - REDIS_HOST=redis
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      - NEXTCLOUD_DATA_DIR=/data
      - NEXTCLOUD_TRUSTED_DOMAINS=nextcloud.home
      - OVERWRITECLIURL=http://nextcloud.home
      - OVERWRITEHOST=nextcloud.home
      - OVERWRITEPROTOCOL=http
      - TRUSTED_PROXIES=192.168.1.206
    volumes:
      - ./config/nextcloud-html:/var/www/html
      - ./config/nextcloud-config:/var/www/html/config
      - ${STORAGE}/Documents:/data
    healthcheck:
      disable: false

  nextcloud-cron:
    image: nextcloud:34.0.4-apache
    container_name: nextcloud-cron
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    entrypoint: /cron.sh
    depends_on:
      - redis
      - mariadb
    volumes:
      - ./config/nextcloud-html:/var/www/html
      - ./config/nextcloud-config:/var/www/html/config
      - ${STORAGE}/Documents:/data

  redis:
    image: valkey/valkey:8.0.3-bookworm
    container_name: redis
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: redis-cli ping || exit 1
  
  mariadb:
    # Note: Check the recommend version here: https://docs.nextcloud.com/server/latest/admin_manual/installation/system_requirements.html#server
    image: mariadb:11.8
    container_name: mariadb
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: --transaction-isolation=READ-COMMITTED
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - ./config/mariadb:/var/lib/mysql

  # Dozzle logs
  dozzle-agent:
    image: amir20/dozzle:v10.10.0
    container_name: dozzle-agent
    restart: always
    command: agent
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 7007:7007
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 5s
      retries: 5
      start_period: 5s
      start_interval: 5s

